name: iOS

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build for device (unsigned)
        run: |
          xcodebuild build \
            -project SplitClip.xcodeproj \
            -scheme SplitClip \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO

      - name: Unit tests (simulator)
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          print(next(d["udid"] for runtime, ds in sorted(devices.items(), reverse=True)
                     if "iOS" in runtime for d in ds if d["name"].startswith("iPhone")))
          ')
          xcodebuild test \
            -project SplitClip.xcodeproj \
            -scheme SplitClip \
            -destination "id=$UDID" \
            CODE_SIGNING_ALLOWED=NO
